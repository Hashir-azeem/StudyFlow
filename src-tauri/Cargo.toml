[package]
name = "studyflow"
version = "0.1.0"
description = "A friction-free student scheduler"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "studyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
